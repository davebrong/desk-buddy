; Desk Buddy — SpotPear/Waveshare ESP32-S3-LCD-1.3 (prism)
; ESP32-S3R8, 16MB flash, 8MB octal PSRAM, ST7789 240x240, CH343 USB-serial

[env:buddy]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_lump.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
board_build.embed_files =
    data/lump.bin
